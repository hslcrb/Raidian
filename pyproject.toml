[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raidian"
version = "0.1.0"
description = "A minimal, Korean-friendly, agent-ready Git workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Raidian contributors"}]
keywords = ["git", "tkinter", "gui", "mcp", "github", "korean"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
raidian = "raidian.cli:main"
raidian-mcp = "raidian.mcp:main"

[project.gui-scripts]
raidian-gui = "raidian.gui:main"

[tool.setuptools.packages.find]
include = ["raidian*"]
